<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiDu Scan</title>
  <!-- icon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-blur"></div>

  <div class="container">
    <!-- Thay thẻ header cũ bằng đoạn này -->
    <header class="header-card" style="position: relative;">
      <button id="btn-settings" class="settings-btn" title="Cài đặt / Cập nhật">
        ⚙️
        <span id="update-badge" class="badge-dot hidden"></span>
      </button>
      <h1>📲 Kết Nối Thiết Bị</h1>
      <p class="subtitle">Quét mã QR bằng điện thoại để bắt đầu</p>
    </header>

    <main>
      <section class="glass-card qr-section">
        <div id="qr-container" class="qr-wrapper">
          <div class="qr-placeholder">Đang tạo mã QR...</div>
        </div>
        <div id="link" class="link-box"></div>
      </section>

      <section class="glass-card files-section">
        <h2>📂 Tài Liệu Nhận Được</h2>
        <p id="status" class="status-badge">
          <span class="dot"></span>
          Đang chờ kết nối...
        </p>
        <div id="received-files" class="files-list"></div>
      </section>
    </main>

    <footer class="footer-note">
      Dữ liệu truyền trực tiếp, không lưu trên máy chủ trung gian
    </footer>

    <!-- Modal Cập nhật / Cài đặt -->
    <div id="update-modal" class="modal-overlay hidden">
      <div class="glass-card modal-content">
        <h3>Cài đặt & Cập nhật</h3>
        <p id="modal-status-text" style="margin: 14px 0; font-size: 14px; color: #475569;">Đang kiểm tra...</p>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button id="btn-manual-check" class="modal-btn">Kiểm tra lại</button>
          <button id="btn-install-now" class="modal-btn btn-primary hidden">Cài đặt ngay</button>
          <button id="btn-close-modal" class="modal-btn">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
